name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / nvim ${{ matrix.nvim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        nvim: [v0.10.4, stable, nightly]
        include:
          - os: macos-latest
            nvim: stable
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Run the offline tests
        shell: bash # explicit, so the step runs with pipefail
        run: |
          nvim --version | head -1
          status=0
          for t in bridge chats prompt render title confirm bash auto runner; do
            echo "::group::${t}_test"
            # a test passes when it exits 0 and its last line is ALL OK
            if nvim --headless -u NONE -l "tests/${t}_test.lua" 2>&1 | tee out.log \
              && [ "$(tail -n 1 out.log)" = "ALL OK" ]; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::${t}_test failed"
              grep -E '^FAIL |FAILED$' out.log || tail -n 20 out.log
              status=1
            fi
          done
          exit $status
